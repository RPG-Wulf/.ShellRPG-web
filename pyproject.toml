[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shellrpg-www"
version = "0.7.6"
description = "Public web gateway and browser UI for the dedicated ShellRPG web process."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
shellrpg-www = "shellrpg_www.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["shellrpg_www*"]
